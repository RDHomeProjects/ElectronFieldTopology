[build-system]
requires = ["hatchling>=1.26,<2"]
build-backend = "hatchling.build"

[project]
name = "electron-field-topology"
version = "0.1.0"
description = "Verified analytical electromagnetic Hopfion benchmarks"
requires-python = ">=3.11,<3.14"
license = "Apache-2.0"
dependencies = ["numpy>=2,<3", "scipy>=1.14,<2", "matplotlib>=3.9,<4"]

[dependency-groups]
dev = ["pytest>=8,<10", "sympy>=1.13,<2"]

[project.scripts]
eft-benchmark = "electron_field_topology.benchmark:main"

[project.optional-dependencies]
gpu = ["cupy-cuda12x[ctk]==14.2.0"]
topology = [
    "snappy==3.3.2",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
