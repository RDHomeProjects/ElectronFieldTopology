name: Analytical Hopfion benchmark
on:
  push:
    paths-ignore:
      - 'reports/**'
      - 'docs/**'
      - '**/*.md'
      - '**/*.bib'
  pull_request:
    paths-ignore:
      - 'reports/**'
      - 'docs/**'
      - '**/*.md'
      - '**/*.bib'
permissions:
  contents: read
jobs:
  analytical:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      MPLBACKEND: Agg
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Install locked environment
        run: |
          python -m pip install uv==0.13.4
          uv sync --frozen --all-groups
      - name: Verify equations, limits and convergence
        run: |
          uv run --frozen pytest -q
          python scripts/check_docs.py
      - name: Generate analytical benchmark
        run: uv run --frozen eft-benchmark --config experiments/configs/hopfion-s1.json --output artifacts/s1-ci
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: analytical-hopfion-evidence
          path: artifacts/s1-ci
          retention-days: 14
          if-no-files-found: error
