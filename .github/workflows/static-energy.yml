name: Static energy instruments
on:
  pull_request:
    paths:
      - 'src/electron_field_topology/sf_*'
      - 'src/electron_field_topology/skyrme.py'
      - 'tests/test_skyrme.py'
      - 'tests/test_sf_topology.py'
      - 'tests/test_sf_minimize.py'
      - 'tests/test_sf_timing.py'
      - 'tests/test_sf_gpu.py'
      - 'tests/test_sf_gpu_relax.py'
      - 'experiments/configs/sf-j2015/**'
      - 'pyproject.toml'
      - 'uv.lock'
      - '.github/workflows/static-energy.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  instruments:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      OMP_NUM_THREADS: '2'
      OPENBLAS_NUM_THREADS: '1'
      MPLBACKEND: Agg
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install locked numerical and optional topology instruments
        run: |
          python -m pip install uv==0.13.4
          uv sync --frozen --all-groups --extra topology
      - name: Verify independent energy, gradient and topology controls
        run: |
          uv run --frozen --extra topology pytest -q tests/test_skyrme.py tests/test_sf_topology.py tests/test_sf_minimize.py tests/test_sf_timing.py tests/test_sf_gpu.py tests/test_sf_gpu_relax.py
          python3 scripts/check_docs.py
      - name: Three-step static instrument smoke test
        run: |
          uv run --frozen --extra topology python -m electron_field_topology.sf_relax --config experiments/configs/sf-j2015/ci-smoke.json --output artifacts/sf-smoke
          python3 - <<'PY'
          import json
          m=json.load(open('artifacts/sf-smoke/result.json'))
          assert m['final']['energy'] <= m['initial']['energy']
          assert m['final']['unit_error'] < 1e-12
          assert m['final']['minimum_corner_cone'] > 0
          assert m['status'] not in ['initial_charge_unresolved','invalid_interpolant','charge_resolution_lost']
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: static-energy-instruments
          path: artifacts/sf-smoke
          retention-days: 14
          if-no-files-found: warn
