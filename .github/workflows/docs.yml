name: Documentation integrity
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  docs:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Check documentation
        run: python3 scripts/check_docs.py
      - name: Verify recovered textual transfer offline
        run: python3 scripts/check_recovered_text_transfer.py --allow-incomplete
      - name: Verify retained workstation transfer offline
        run: python3 scripts/check_workstation_evidence.py
