name: Neutral SF time solver and offline renderer
on:
  pull_request:
    paths:
      - 'src/electron_field_topology/sf_time*.py'
      - 'src/electron_field_topology/sf_boost*.py'
      - 'src/electron_field_topology/sf_focused*.py'
      - 'src/electron_field_topology/sf_temporal*.py'
      - 'src/electron_field_topology/sf_higher_q*.py'
      - 'tests/test_sf_higher_q.py'
      - 'experiments/configs/s5-b/007-higher-q-motion/**'
      - 'tests/test_sf_temporal.py'
      - 'src/electron_field_topology/sf_tail*.py'
      - 'src/electron_field_topology/sf_q1*.py'
      - 'tests/test_sf_q1_settling.py'
      - 'experiments/configs/s5-b/009-q1-tail-settling/**'
      - 'tests/test_sf_tail_domain.py'
      - 'experiments/configs/s5-b/008-tail-domain-screening/**'
      - 'tests/test_sf_focused_motion.py'
      - 'experiments/configs/s5-b/006-focused-motion-convergence/**'
      - 'src/electron_field_topology/sf_reconstruction.py'
      - 'tests/test_sf_reconstruction.py'
      - 'scripts/publish_boost_study.py'
      - 'experiments/configs/s5-b/005-boost-initialization/**'
      - 'src/electron_field_topology/sf_readmission.py'
      - 'src/electron_field_topology/sf_motion*.py'
      - 'src/electron_field_topology/sf_lowq_motion.py'
      - 'tests/test_sf_readmission.py'
      - 'tests/test_sf_motion_diagnostics.py'
      - 'tests/test_sf_lowq_motion.py'
      - 'tests/test_sf_motion_local.py'
      - 'experiments/configs/sf-motion/**'
      - 'src/electron_field_topology/sf_preview.py'
      - 'src/electron_field_topology/sf_renderer.py'
      - 'src/electron_field_topology/sf_dynamics.py'
      - 'tests/test_sf_time.py'
      - 'tests/test_sf_renderer.py'
      - 'scripts/check_sf_time.py'
      - 'experiments/configs/sf-time/**'
      - 'experiments/configs/renderers/**'
      - '.github/workflows/sf-time-renderer.yml'
      - 'pyproject.toml'
      - 'uv.lock'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  controls:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      OMP_NUM_THREADS: '2'
      OPENBLAS_NUM_THREADS: '1'
      MPLBACKEND: Agg
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install uv==0.13.4
      - run: uv sync --frozen --all-groups
      - run: uv run --frozen pytest -q tests/test_sf_time.py tests/test_sf_renderer.py tests/test_sf_dynamics.py tests/test_sf_readmission.py tests/test_sf_lowq_motion.py tests/test_sf_motion_local.py tests/test_sf_motion_diagnostics.py tests/test_sf_reconstruction.py tests/test_sf_focused_motion.py tests/test_sf_tail_domain.py tests/test_sf_q1_settling.py tests/test_sf_temporal.py tests/test_sf_higher_q.py
      - run: uv run --frozen python scripts/check_sf_time.py --output artifacts/sf-time-controls.json
      - run: python3 scripts/check_docs.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: sf-time-controls
          path: artifacts/sf-time-controls.json
          if-no-files-found: warn
          retention-days: 14
