name: Neutral SF dynamics admission
on:
  pull_request:
    paths:
      - 'src/electron_field_topology/sf_dynamics*.py'
      - 'tests/test_sf_dynamics.py'
      - 'experiments/configs/sf-dynamics/**'
      - '.github/workflows/sf-dynamics.yml'
      - 'pyproject.toml'
      - 'uv.lock'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  instruments:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      OMP_NUM_THREADS: '2'
      OPENBLAS_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install uv==0.13.4
      - run: uv sync --frozen --all-groups
      - run: uv run --frozen pytest -q tests/test_sf_dynamics.py
      - run: uv run --frozen python -m electron_field_topology.sf_dynamics_admission verify
